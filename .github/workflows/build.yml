name: Build the thesis and deploy on GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build thesis PDF
        run: nix build --print-build-logs

      - name: Upload thesis PDF
        uses: actions/upload-artifact@v7
        with:
          name: thesis.pdf
          path: result/thesis.pdf

  deploy:
    needs: build

    # Pages can only be published from the default branch
    if: github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download thesis PDF
        uses: actions/download-artifact@v8
        with:
          name: thesis.pdf
          path: github-pages/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
